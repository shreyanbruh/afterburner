[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "afterburner-cli"
version = "0.1.0"
description = "Turn audio files into graphs."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "librosa",
    "matplotlib",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shreyan Banerjee" }]
readme = "README.md"

[project.optional-dependencies]
tui = ["textual"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

